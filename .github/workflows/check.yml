name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Nothing private in the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/check-public.mjs "$BASE..$HEAD"
          else
            node scripts/check-public.mjs "$HEAD"
          fi
      - run: npx -y @anthropic-ai/claude-code@2.1.270 plugin validate . --strict
      - name: Validate each local plugin
        run: |
          for p in plugins/*/; do
            npx -y @anthropic-ai/claude-code@2.1.270 plugin validate "$p" --strict
          done
      - name: Dry-run the apply step into an empty repo
        run: |
          t="$(mktemp -d)"
          node lib/apply.mjs "$t" nextjs,postgres
          test -f "$t/.claude/settings.json"
          test -s "$t/.claude/knowledge/must.md"
          ls "$t/.claude/skills"
